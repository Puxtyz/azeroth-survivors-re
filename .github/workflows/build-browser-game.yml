name: Build browser game
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev curl unzip brotli
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Prepare WebAssembly tools
        run: bash scripts/web-setup.sh
      - name: Build browser game
        run: bash scripts/web-build.sh
      - name: Verify browser output
        run: |
          test -s web/dist/index.html
          test -s web/dist/wenilla.js
          test -s web/dist/wenilla_bg.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: azeroth-browser-files
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Build Windows server
        run: cargo build --locked --release -p wenilla-host
      - uses: actions/upload-artifact@v4
        with:
          name: azeroth-windows-host
          path: target/release/wenilla-host.exe
          if-no-files-found: error
          retention-days: 7
